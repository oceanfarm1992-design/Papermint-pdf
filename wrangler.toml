# Cloudflare deployment config.
#
# This project is a fully static SPA (all PDF work happens in the browser).
# It is deployed as a Worker serving static assets from ./dist.
#
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy   (runs automatically on git push)
#
# The [assets] block makes `wrangler deploy` upload ./dist as static assets with
# single-page-application fallback, so client-side routes (e.g. /tool/merge-pdf)
# resolve to index.html instead of 404ing.

name = "papermint-pdf"
compatibility_date = "2026-07-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
