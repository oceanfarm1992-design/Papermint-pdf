# CodeQL static analysis — finds injection flaws, prototype pollution,
# unsafe APIs, and weak-crypto patterns in first-party TypeScript.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    # Code scanning requires GitHub Advanced Security on private repos. Until it
    # is enabled (or the repo is public), the upload step reports a
    # configuration error — allow that to fail gracefully so it never blocks
    # PRs or merges. The analysis still runs and will surface results the moment
    # code scanning is available.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        continue-on-error: true
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths:
              - src
              - scripts
              - public
            paths-ignore:
              - '**/__tests__'
              - dist

      - uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: '/language:javascript-typescript'
