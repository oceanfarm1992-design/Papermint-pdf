# Performance gate — Lighthouse CI against the production build.
# Asserts minimum category scores and budgets for FCP / LCP / TBT / TTI
# (see lighthouserc.json). Report links land in the job summary + artifact.
name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Summarize scores
        if: always()
        env:
          LHCI_MANIFEST: ${{ steps.lhci.outputs.manifest }}
        run: |
          {
            echo "## 🔦 Lighthouse results"
            echo ""
            echo '```json'
            printf '%s' "$LHCI_MANIFEST" | head -c 6000
            echo ""
            echo '```'
            echo ""
            echo "Full HTML reports: see the **lighthouse-ci-report** artifact and the temporary-public-storage links in the step log."
          } >> "$GITHUB_STEP_SUMMARY"
