# Live tool check — runs every one of the 60 tools against the PRODUCTION site
# (https://privacypdftools.com) in Chromium, Firefox and WebKit, with real files,
# and verifies editor downloads actually contain the edits.
# Daily, after each deploy to main, and on demand (Actions → Live tool check → Run workflow).
# A failed scheduled run opens a GitHub issue.
name: Live tool check

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-tools
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # After a push to main, give Cloudflare time to finish deploying first.
      - name: Wait for deploy
        if: github.event_name == 'push'
        run: sleep 240

      - name: Run every tool on the live site
        run: npx playwright test -c e2e-live/playwright.live.config.ts --project=${{ matrix.browser }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-tools-${{ matrix.browser }}
          path: |
            e2e-live/.out/results.json
            test-results/
          retention-days: 14

  report:
    name: Open issue on scheduled failure
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Live tool check failed (${new Date().toISOString().slice(0, 10)})`,
              body: `One or more tools failed on https://privacypdftools.com.\n\nRun: ${url}\n\nDownload the \`live-tools-*\` artifacts for per-tool results.`,
            })
